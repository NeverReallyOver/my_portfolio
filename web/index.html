  <style>
    html, body { margin: 0; padding: 0; background: #F6F4EF; }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #F6F4EF;
      color: #16181D;
      font-family: Georgia, 'Times New Roman', serif;
      z-index: 9999;
      transition: opacity 250ms ease;
    }

    #loading .name { font-size: 22px; letter-spacing: -0.2px; }

    #loading .bar {
      width: 120px;
      height: 2px;
      background: #DCD7CC;
      overflow: hidden;
      position: relative;
    }

    #loading .bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      background: #1F3A5F;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>

<body>
  <div id="loading" aria-live="polite">
    <div class="name">Janakiraman Velayutham</div>
    <div class="bar" role="progressbar" aria-label="Loading"></div>
  </div>

  <noscript>
    <h1>Janakiraman Velayutham, Flutter Developer</h1>
    <p>I build real-time trading apps in Flutter. Contact: vjanakiraman03@gmail.com</p>
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
